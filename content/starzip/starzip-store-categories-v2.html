<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starzip — 상점 카테고리 v2</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --g0:#fff;--g50:#F9FAFB;--g100:#F2F4F7;--g200:#EAECF0;
  --g300:#D0D5DD;--g400:#98A2B3;--g500:#667085;--g600:#475467;
  --g700:#344054;--g800:#1D2939;--g900:#101828;
  --p25:#F5F8FF;--p50:#EFF4FF;--p100:#D1E0FF;--p500:#2970FF;--p600:#155EEF;--p700:#004EEB;
  --s50:#ECFDF3;--s200:#A9EFC5;--s500:#12B76A;--s700:#027A48;
  --e50:#FEF3F2;--e200:#FECDCA;--e500:#F04438;
  --w50:#FFFAEB;--w200:#FEDF89;--w500:#F79009;--w700:#B54708;
  --sans:'Plus Jakarta Sans',sans-serif;
  --mono:'DM Mono',monospace;
  --r6:6px;--r8:8px;--r12:12px;--r16:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--g50);color:var(--g900);font-size:14px;line-height:1.5;min-height:100vh}

/* ── 상단 네비 ── */
.top-nav{background:var(--g0);border-bottom:1px solid var(--g200);padding:0 24px;display:flex;align-items:center;gap:0;height:52px;position:sticky;top:0;z-index:100}
.nav-logo{font-size:15px;font-weight:800;color:var(--g900);display:flex;align-items:center;gap:7px;margin-right:20px}
.nav-logo-mark{width:24px;height:24px;border-radius:6px;background:var(--p600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.nav-tabs{display:flex;height:100%}
.nav-tab{padding:0 14px;font-size:13px;font-weight:500;color:var(--g400);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav-tab:hover{color:var(--g700)}
.nav-tab.on{color:var(--g900);border-bottom-color:var(--g900);font-weight:600}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}

/* ── 2패널 레이아웃 ── */
.layout{display:flex;height:calc(100vh - 52px)}

/* ── 왼쪽: 축 선택 ── */
.axis-panel{width:200px;flex-shrink:0;background:var(--g0);border-right:1px solid var(--g200);padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.axis-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g400);padding:8px 8px 5px;margin-top:8px}
.axis-label:first-child{margin-top:0}
.axis-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r8);font-size:13px;font-weight:500;color:var(--g600);border:none;background:none;cursor:pointer;transition:all .12s;width:100%;text-align:left}
.axis-btn:hover{background:var(--g50);color:var(--g800)}
.axis-btn.on{background:var(--g100);color:var(--g900);font-weight:600}
.axis-ico{font-size:14px;flex-shrink:0}
.axis-count{margin-left:auto;font-size:10px;font-weight:600;padding:1px 6px;border-radius:20px;background:var(--g100);color:var(--g500)}
.axis-btn.on .axis-count{background:var(--p50);color:var(--p600)}
.axis-divider{height:1px;background:var(--g100);margin:8px 0}

/* ── 오른쪽: 콘텐츠 ── */
.content-panel{flex:1;overflow-y:auto;padding:20px 24px 60px}

/* 페이지 헤더 */
.ph{margin-bottom:20px}
.ph-row{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.ph-left{}
.ph-title{font-size:18px;font-weight:800;color:var(--g900);letter-spacing:-.02em;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.ph-sub{font-size:13px;color:var(--g500)}
.ph-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* 툴바 */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:8px;background:var(--g0);border:1px solid var(--g200);border-radius:var(--r8);padding:8px 12px;flex:1;min-width:180px}
.search-box:focus-within{border-color:var(--p500);box-shadow:0 0 0 3px rgba(41,112,255,.08)}
.search-input{border:none;outline:none;font-size:13px;color:var(--g700);background:transparent;flex:1;font-family:var(--sans)}
.search-input::placeholder{color:var(--g400)}
.cnt-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--g100);color:var(--g500);white-space:nowrap}
.view-toggle{display:flex;gap:3px;background:var(--g100);border-radius:var(--r8);padding:3px}
.vt{width:30px;height:30px;border-radius:6px;border:none;background:none;cursor:pointer;color:var(--g400);font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.vt.on{background:var(--g0);color:var(--g900);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* 필터 칩 */
.chip-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--g200);background:var(--g0);color:var(--g600);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--g300)}
.chip.on{background:var(--g900);color:#fff;border-color:var(--g900)}

/* 선택 바 */
.sel-bar{display:flex;align-items:center;gap:8px;background:var(--g900);color:#fff;border-radius:var(--r12);padding:9px 14px;margin-bottom:14px;flex-wrap:wrap}
.sel-tags{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.sel-tag{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);border-radius:20px;padding:2px 9px;font-size:12px}
.sel-x{cursor:pointer;opacity:.6;font-size:13px;transition:opacity .12s}
.sel-x:hover{opacity:1}
.sel-clear{font-size:11px;color:rgba(255,255,255,.6);cursor:pointer;padding:3px 8px;border-radius:20px;border:1px solid rgba(255,255,255,.2);white-space:nowrap;transition:all .12s}
.sel-clear:hover{background:rgba(255,255,255,.1)}

/* 섹션 */
.sec{margin-bottom:24px}
.sec-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--g400);white-space:nowrap}
.sec-line{flex:1;height:1px;background:var(--g200)}
.sec-cnt{font-size:10px;color:var(--g400);font-family:var(--mono)}

/* 그리드 카드 */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
.cat-card{background:var(--g0);border:1px solid var(--g200);border-radius:var(--r12);padding:13px 11px;cursor:pointer;transition:all .14s;position:relative;overflow:hidden;user-select:none}
.cat-card:hover{border-color:var(--g300);box-shadow:0 2px 8px rgba(0,0,0,.07);transform:translateY(-1px)}
.cat-card.on{border-color:var(--p500);background:var(--p25)}
.cc-icon{font-size:22px;margin-bottom:7px;display:block;line-height:1}
.cc-name{font-size:12px;font-weight:600;color:var(--g800);margin-bottom:1px;line-height:1.3}
.cc-en{font-size:10px;color:var(--g400);font-weight:400}
.cc-count{font-size:10px;color:var(--g400);font-family:var(--mono);margin-top:6px;display:flex;align-items:center;gap:3px}
.cc-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cat-card.on .cc-name{color:var(--p700)}
.cat-card.on .cc-en{color:var(--p500)}
.cat-card.on .cc-count{color:var(--p500)}

/* 리스트 행 */
.cat-list{display:flex;flex-direction:column;gap:3px}
.cl-row{background:var(--g0);border:1px solid var(--g200);border-radius:var(--r8);padding:9px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .12s}
.cl-row:hover{border-color:var(--g300);background:var(--g50)}
.cl-row.on{border-color:var(--p500);background:var(--p25)}
.cl-ico{font-size:17px;width:28px;text-align:center;flex-shrink:0}
.cl-info{flex:1;min-width:0}
.cl-name{font-size:13px;font-weight:600;color:var(--g800)}
.cl-sub{font-size:11px;color:var(--g500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.cl-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cl-n{font-size:11px;font-weight:600;color:var(--g400);font-family:var(--mono)}
.cl-arr{color:var(--g300);font-size:11px}
.cl-row.on .cl-name{color:var(--p700)}
.cl-row.on .cl-n{color:var(--p500)}

/* 국가 카드 (특별 스타일) */
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px}
.country-card{background:var(--g0);border:1px solid var(--g200);border-radius:var(--r12);padding:12px 14px;cursor:pointer;transition:all .14s;display:flex;align-items:center;gap:10px;user-select:none}
.country-card:hover{border-color:var(--g300);box-shadow:0 2px 8px rgba(0,0,0,.07)}
.country-card.on{border-color:var(--p500);background:var(--p25)}
.c-flag{font-size:22px;flex-shrink:0;line-height:1}
.c-info{min-width:0;flex:1}
.c-name{font-size:13px;font-weight:600;color:var(--g800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-en{font-size:10px;color:var(--g400)}
.c-n{font-size:10px;color:var(--g400);font-family:var(--mono);margin-top:3px}
.country-card.on .c-name{color:var(--p700)}
.country-card.on .c-n{color:var(--p500)}

/* 지역 헤더 */
.region-header{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.rh-icon{font-size:18px}
.rh-name{font-size:14px;font-weight:700;color:var(--g800)}
.rh-sub{font-size:11px;color:var(--g500)}
.rh-line{flex:1;height:1px;background:var(--g200)}
.rh-count{font-size:11px;color:var(--g400);font-family:var(--mono);white-space:nowrap}
.region-header:first-child{margin-top:0}

/* 배너 */
.info-banner{border-radius:var(--r8);padding:10px 14px;font-size:12px;display:flex;align-items:flex-start;gap:8px;margin-bottom:16px;line-height:1.5}
.ib-red{background:var(--e50);border:1px solid var(--e200);color:var(--e500)}
.ib-blue{background:var(--p50);border:1px solid var(--p100);color:var(--p700)}
.ib-yellow{background:var(--w50);border:1px solid var(--w200);color:var(--w700)}

/* 빈 상태 */
.empty{text-align:center;padding:48px 0;color:var(--g400)}
.empty-ico{font-size:36px;margin-bottom:10px;opacity:.4}
.empty-txt{font-size:13px}

/* 반응형 */
@media(max-width:768px){
  .layout{flex-direction:column}
  .axis-panel{width:100%;flex-direction:row;overflow-x:auto;height:auto;padding:8px 12px;gap:4px;flex-wrap:nowrap}
  .axis-label{display:none}
  .axis-divider{display:none}
  .axis-btn{white-space:nowrap;padding:6px 10px}
}
@media(max-width:500px){.cat-grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}}
</style>
</head>
<body>

<!-- NAV -->
<nav class="top-nav">
  <div class="nav-logo"><div class="nav-logo-mark">SZ</div>Starzip</div>
  <div class="nav-tabs">
    <button class="nav-tab on" id="nav-cat" onclick="swAxis('cat-all',this)">🗂 업종 카테고리</button>
    <button class="nav-tab" id="nav-geo" onclick="swAxis('geo-all',this)">🌍 지역·국가</button>
  </div>
  <div class="nav-right">
    <span class="nav-badge" id="sel-count-badge" style="background:var(--p50);color:var(--p600);display:none">0개 선택</span>
  </div>
</nav>

<div class="layout">

  <!-- 왼쪽 축 패널 -->
  <aside class="axis-panel" id="axis-panel"></aside>

  <!-- 오른쪽 콘텐츠 -->
  <main class="content-panel" id="content-panel">

    <div class="ph">
      <div class="ph-row">
        <div class="ph-left">
          <div class="ph-title" id="ph-title">🗂 업종 카테고리</div>
          <div class="ph-sub" id="ph-sub">런치패드·Trade 필터 및 사업주 등록에 공통 적용</div>
        </div>
        <div class="ph-right">
          <div class="view-toggle">
            <button class="vt on" id="vt-g" onclick="setView('grid')" title="그리드">⊞</button>
            <button class="vt" id="vt-l" onclick="setView('list')" title="리스트">☰</button>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <span style="color:var(--g400);font-size:13px">🔍</span>
          <input class="search-input" id="search" type="text" placeholder="검색..." oninput="doSearch()">
        </div>
        <span class="cnt-badge" id="cnt-badge">—</span>
      </div>

      <div class="chip-row" id="chip-row"></div>
    </div>

    <!-- 선택 바 -->
    <div class="sel-bar" id="sel-bar" style="display:none">
      <span style="font-size:13px;font-weight:600">선택됨</span>
      <div class="sel-tags" id="sel-tags"></div>
      <span class="sel-clear" onclick="clearAll()">전체 해제</span>
    </div>

    <!-- 배너 -->
    <div class="info-banner ib-red" id="prohib-banner">
      🚫 <span><strong>상장 불가 업종:</strong> 도박·성인·무기·가상자산 관련 업종. 금지 목록은 관리자 콘솔 DB에서 관리됩니다.</span>
    </div>
    <div class="info-banner ib-blue" id="geo-banner" style="display:none">
      🌍 <span><strong>글로벌 확장 지원:</strong> Starzip은 opBNB 기반으로 국경 없이 운영됩니다. 국가·지역별 필터로 현지 상점을 탐색하세요.</span>
    </div>

    <!-- 메인 콘텐츠 -->
    <div id="main-content"></div>

  </main>
</div>

<script>

function swAxis(id, btn){
  if(id.startsWith('cat')){
    mode='cat'; catGroup=id;

    document.getElementById('nav-geo').classList.remove('on');

  } else {
    mode='geo'; geoRegion=id;
    document.getElementById('nav-geo').classList.add('on');
    document.getElementById('nav-cat').classList.remove('on');

  renderAxisPanel();

}

/* ══════════════════════════
   축 패널
══════════════════════════ */
function renderAxisPanel(){
  const items = mode==='cat' ? CAT_GROUPS : GEO_REGIONS;
  const currentId = mode==='cat' ? catGroup : geoRegion;
  let html='';
  items.forEach((item,i)=>{
    if(i===0) html+=`<div class="axis-label">${mode==='cat'?'업종 대분류':'지역'}</div>`;
    const cnt = mode==='cat'
      ? (item.id==='all-cat' ? CAT_DATA.length : CAT_DATA.filter(c=>c.g===item.id).length)
      : (item.id==='all-geo' ? GEO_DATA.length : GEO_DATA.filter(c=>c.r===item.id).length);
    html+=`<button class="axis-btn${currentId===item.id?' on':''}" onclick="axisClick('${item.id}',this)">
      <span class="axis-ico">${item.icon}</span>${item.label}
      <span class="axis-count">${cnt}</span>
    </button>`;
  });
  document.getElementById('axis-panel').innerHTML=html;
}

function axisClick(id, btn){
  if(mode==='cat') catGroup=id;
  else geoRegion=id;
  document.querySelectorAll('.axis-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  searchQ=''; document.getElementById('search').value='';
  render();
}

/* ══════════════════════════
   칩
══════════════════════════ */
function renderChips(){
  const row = document.getElementById('chip-row');
  if(mode==='cat'){
    row.innerHTML = CAT_GROUPS.map(g=>
      `<button class="chip${(catGroup===g.id||(!catGroup&&g.id==='all-cat'))?' on':''}" onclick="chipClickCat('${g.id}',this)">${g.icon} ${g.label}</button>`
    ).join('');
  } else {
    const phases=['all','live','beta','soon','plan'];
    const labels={all:'전체',live:'🟢 서비스 중',beta:'🔵 베타',soon:'⏳ 준비 중',plan:'📋 계획'};
    row.innerHTML = phases.map(p=>
      `<button class="chip${filterPhase===p?' on':''}" onclick="chipPhase('${p}',this)">${labels[p]}</button>`
    ).join('');
  }
}

function chipClickCat(id, btn){
  catGroup=id;
  document.querySelectorAll('.axis-btn').forEach(b=>{
    if(b.textContent.trim().includes(id)||id==='all-cat') b.classList.remove('on');
  });
  document.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  searchQ=''; document.getElementById('search').value='';
  // axis 패널도 동기화
  renderAxisPanel();
  document.querySelectorAll('.axis-btn').forEach(b=>{
    // 비교
  });
  render();
}

function chipPhase(p, btn){
  filterPhase=p;
  document.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

   검색
══════════════════════════ */
function doSearch(){
  searchQ = document.getElementById('search').value.trim().toLowerCase();
  render();
}

/* ══════════════════════════
   선택
══════════════════════════ */
function toggleItem(id){
  if(selected.has(id)) selected.delete(id); else selected.add(id);
  renderSelBar();
  renderCountBadge();
  render();
}
function clearAll(){
  selected.clear(); renderSelBar(); renderCountBadge(); render();
}
function renderSelBar(){
  const bar=document.getElementById('sel-bar');
  const tags=document.getElementById('sel-tags');
  if(selected.size===0){bar.style.display='none';return;}
  bar.style.display='flex';
  const allItems=[...CAT_DATA,...GEO_DATA];
  const items=allItems.filter(i=>selected.has(i.id));
  tags.innerHTML=items.map(i=>
    `<span class="sel-tag">${i.flag||i.icon} ${i.name}<span class="sel-x" onclick="toggleItem('${i.id}')">×</span></span>`
  ).join('');
}
function renderCountBadge(){
  const b=document.getElementById('sel-count-badge');
  if(selected.size===0){b.style.display='none';}
  else{b.style.display='inline-flex';b.textContent=selected.size+'개 선택';}
}

/* ══════════════════════════
   렌더: 업종
══════════════════════════ */
function renderCat(){
  const groups = catGroup==='all-cat'
    ? CAT_GROUPS.filter(g=>g.id!=='all-cat')
    : CAT_GROUPS.filter(g=>g.id===catGroup);

  let total=0; let html='';
  groups.forEach(g=>{
    let cats = CAT_DATA.filter(c=>c.g===g.id);
    if(searchQ) cats=cats.filter(c=>
      c.name.includes(searchQ)||c.en.toLowerCase().includes(searchQ)||(c.desc&&c.desc.includes(searchQ))
    );
    if(!cats.length) return;
    total+=cats.length;
    const color = CAT_GROUPS.find(x=>x.id===g.id)?.color||'#667085';
    html+=`<div class="sec">
      <div class="sec-hd">
        <span class="sec-lbl">${g.icon} ${g.label}</span>
        <div class="sec-line"></div>
        <span class="sec-cnt">${cats.length}개</span>
      </div>`;
    if(viewMode==='grid'){
      html+=`<div class="cat-grid">`;
      cats.forEach(c=>{
        const on=selected.has(c.id)?' on':'';
        html+=`<div class="cat-card${on}" onclick="toggleItem('${c.id}')">
          <span class="cc-icon">${c.icon}</span>
          <div class="cc-name">${c.name}</div>
          <div class="cc-en">${c.en}</div>
          <div class="cc-count"><div class="cc-dot" style="background:${color}"></div>${c.n}개 상점</div>
        </div>`;
      });
      html+=`</div>`;
    } else {
      html+=`<div class="cat-list">`;
      cats.forEach(c=>{
        const on=selected.has(c.id)?' on':'';
        html+=`<div class="cl-row${on}" onclick="toggleItem('${c.id}')">
          <span class="cl-ico">${c.icon}</span>
          <div class="cl-info"><div class="cl-name">${c.name} <span style="font-weight:400;font-size:11px;color:var(--g400)">${c.en}</span></div><div class="cl-sub">${c.desc}</div></div>
          <div class="cl-right"><span class="cl-n">${c.n}개</span><span class="cl-arr">›</span></div>
        </div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  document.getElementById('cnt-badge').textContent=
    selected.size>0 ? `${total}개 · ${selected.size}개 선택` : `${total}개 카테고리`;
  return html || `<div class="empty"><div class="empty-ico">🔍</div><div class="empty-txt">"${searchQ}" 결과 없음</div></div>`;
}

/* ══════════════════════════
   렌더: 지역·국가
══════════════════════════ */
function renderGeo(){
  const regions = geoRegion==='all-geo'
    ? GEO_REGIONS.filter(r=>r.id!=='all-geo')
    : GEO_REGIONS.filter(r=>r.id===geoRegion);

  let total=0; let html='';
  regions.forEach(reg=>{
    let countries=GEO_DATA.filter(c=>c.r===reg.id);
    if(searchQ) countries=countries.filter(c=>
      c.name.includes(searchQ)||c.en.toLowerCase().includes(searchQ)||(c.sub&&c.sub.includes(searchQ))
    );
    if(filterPhase!=='all') countries=countries.filter(c=>c.phase===filterPhase);
    if(!countries.length) return;
    total+=countries.length;
    html+=`<div class="region-header">
      <span class="rh-icon">${reg.icon}</span>
      <span class="rh-name">${reg.label}</span>
      <span class="rh-sub" style="margin-left:4px;font-size:11px;color:var(--g400)"></span>
      <div class="rh-line"></div>
      <span class="rh-count">${countries.length}개국</span>
    </div>
    <div class="country-grid" style="margin-bottom:20px">`;
    countries.forEach(c=>{
      const on=selected.has(c.id)?' on':'';
      const pcolor=PHASE_COLORS[c.phase]||'#667085';
      const plabel=PHASE_LABELS[c.phase]||'';
      html+=`<div class="country-card${on}" onclick="toggleItem('${c.id}')">
        <span class="c-flag">${c.flag}</span>
        <div class="c-info">
          <div class="c-name">${c.name}</div>
          <div class="c-en">${c.en}</div>
          <div class="c-n" style="display:flex;align-items:center;gap:4px;margin-top:4px">
            <span style="color:${pcolor};font-size:9px;font-weight:700">${plabel}</span>
          </div>
          <div class="c-n">${c.n}개 상점</div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });

  // 통계 바
  const live=GEO_DATA.filter(c=>c.phase==='live').length;
  const beta=GEO_DATA.filter(c=>c.phase==='beta').length;
  const soon=GEO_DATA.filter(c=>c.phase==='soon').length;
  const plan=GEO_DATA.filter(c=>c.phase==='plan').length;
  const summary=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    ${[['🟢 서비스 중',live,'#027A48'],['🔵 베타',beta,'#155EEF'],['⏳ 준비 중',soon,'#B54708'],['📋 계획',plan,'#667085']].map(([l,n,c])=>
      `<div style="display:flex;align-items:center;gap:5px;background:var(--g0);border:1px solid var(--g200);border-radius:var(--r8);padding:6px 12px">
        <span style="font-size:11px;font-weight:700;color:${c}">${l}</span>
        <span style="font-size:13px;font-weight:700;color:var(--g900);font-family:var(--mono)">${n}</span>
      </div>`
    ).join('')}
  </div>`;

  document.getElementById('cnt-badge').textContent=
    selected.size>0 ? `${total}개국 · ${selected.size}개 선택` : `${total}개국`;
  return (summary+html) || `<div class="empty"><div class="empty-ico">🔍</div><div class="empty-txt">결과 없음</div></div>`;
}

/* ══════════════════════════
   렌더 진입점
══════════════════════════ */
function render(){
  document.getElementById('main-content').innerHTML =
    mode==='cat' ? renderCat() : renderGeo();
}

function setView(v){
  viewMode=v;
  document.getElementById('vt-g').classList.toggle('on',v==='grid');
  document.getElementById('vt-l').classList.toggle('on',v==='list');
  render();
}

/* ══════════════════════════
   초기화
══════════════════════════ */
swAxis('cat-all', document.getElementById('nav-cat'));
</script>
</body>
</html>
